<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine - Classificador</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos customizados -->
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            min-height: 100vh;
        }

        .container-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-top: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .btn-start {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            color: white;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn-start:hover {
            transform: scale(1.05);
            background: linear-gradient(45deg, #0072ff, #00c6ff);
        }

        #webcam-container canvas {
            border-radius: 10px;
            margin-top: 20px;
            max-width: 100%;
        }

        .progress {
            height: 25px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar {
            font-weight: bold;
        }

        .label-title {
            text-align: left;
            font-size: 14px;
            margin-bottom: 3px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="container-box">
            <h2 class="mb-3">🤖 Classificador com Teachable Machine</h2>
            <p class="mb-4">Clique no botão abaixo para ativar sua câmera</p>

            <button class="btn btn-start" onclick="init()">
                🎥 Permitir acesso à câmera
            </button>

            <div id="webcam-container" class="mt-4"></div>

            <div id="label-container" class="mt-4"></div>
        </div>
    </div>

    <!-- TensorFlow + Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script>
        const URL = "./my_model/";

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true;
            webcam = new tmImage.Webcam(300, 300, flip);
            await webcam.setup();
            await webcam.play();
            window.requestAnimationFrame(loop);

            document.getElementById("webcam-container").innerHTML = "";
            document.getElementById("webcam-container").appendChild(webcam.canvas);

            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = "";

            for (let i = 0; i < maxPredictions; i++) {
                const wrapper = document.createElement("div");

                const label = document.createElement("div");
                label.className = "label-title";

                const progress = document.createElement("div");
                progress.className = "progress";

                const bar = document.createElement("div");
                bar.className = "progress-bar bg-success";
                bar.style.width = "0%";
                bar.innerText = "0%";

                progress.appendChild(bar);
                wrapper.appendChild(label);
                wrapper.appendChild(progress);

                labelContainer.appendChild(wrapper);
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);

            for (let i = 0; i < maxPredictions; i++) {
                const prob = (prediction[i].probability * 100).toFixed(1);

                const wrapper = labelContainer.childNodes[i];
                const label = wrapper.childNodes[0];
                const bar = wrapper.childNodes[1].childNodes[0];

                label.innerHTML = prediction[i].className;

                bar.style.width = prob + "%";
                bar.innerText = prob + "%";

                if (prob > 70) {
                    bar.className = "progress-bar bg-success";
                } else if (prob > 40) {
                    bar.className = "progress-bar bg-warning";
                } else {
                    bar.className = "progress-bar bg-danger";
                }
            }
        }
    </script>

</body>
</html>
